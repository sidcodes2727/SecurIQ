<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SecurIQ Report{% endblock %}</title>
<style>
  :root {
    --ink: #111827; --ink-2: #374151; --muted: #6b7280; --line: #e5e7eb; --paper: #ffffff; --panel: #f8fafc;
    --accent: #0e7490; --good: #15803d; --ok: #4d7c0f; --mid: #a16207; --warn: #c2410c; --bad: #b91c1c;
    --good-bg: #dcfce7; --ok-bg: #ecfccb; --mid-bg: #fef9c3; --warn-bg: #ffedd5; --bad-bg: #fee2e2; --na-bg: #f3f4f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef2f7; color: var(--ink); font: 13px/1.55 "Segoe UI", Inter, system-ui, sans-serif; }
  .page { max-width: 900px; margin: 24px auto; background: var(--paper); padding: 40px 48px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  header.report { border-bottom: 3px solid var(--accent); padding-bottom: 14px; margin-bottom: 22px; }
  header.report .brand { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 11px; text-transform: uppercase; }
  h1 { font-size: 22px; margin: 4px 0 6px; }
  h2 { font-size: 15px; margin: 26px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); break-after: avoid; }
  h3 { font-size: 13px; margin: 16px 0 6px; }
  .meta { color: var(--muted); font-size: 12px; }
  .grid { display: grid; gap: 12px; }
  .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g2 { grid-template-columns: 1fr 1fr; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--ink-2); }
  .bottom-line { background: var(--panel); border-left: 4px solid var(--accent); padding: 12px 16px; margin: 14px 0; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 10px; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--panel); font-weight: 600; color: var(--ink-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: Consolas, "JetBrains Mono", monospace; font-size: 11px; word-break: break-all; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .pill.good { background: var(--good-bg); color: var(--good); } .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.mid { background: var(--mid-bg); color: var(--mid); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.na { background: var(--na-bg); color: var(--muted); }
  .src-observed { background: #e0f2fe; color: #075985; } .src-inferred { background: #ede9fe; color: #5b21b6; }
  .src-not_observable { background: var(--na-bg); color: var(--muted); }
  .good-t { color: var(--good); } .ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--bad); } .na-t { color: var(--muted); }
  .bar { height: 8px; background: var(--na-bg); border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar > span { display: block; height: 100%; }
  .bar .good { background: var(--good); } .bar .ok { background: #65a30d; } .bar .warn { background: #ea580c; } .bar .bad { background: var(--bad); } .bar .na { background: #9ca3af; }
  .matrix { display: grid; grid-template-columns: 70px repeat(5, 1fr); gap: 3px; font-size: 11px; }
  .matrix .cell { min-height: 44px; border-radius: 4px; padding: 4px; }
  .matrix .axis { display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .muted { color: var(--muted); }
  ul.tight { margin: 4px 0; padding-left: 18px; }
  footer { margin-top: 30px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  @media print {
    body { background: #fff; }
    .page { box-shadow: none; margin: 0; max-width: none; padding: 0; }
    @page { size: A4; margin: 16mm 14mm; }
    tr, .tile { break-inside: avoid; }
  }
  @media (max-width: 700px) {
    .page { padding: 20px 16px; margin: 0; }
    .g3, .g4, .g2 { grid-template-columns: 1fr 1fr; }
    table { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="page">
{% block body %}{% endblock %}
<footer>Generated by SecurIQ — AI-Powered IPsec VPN Protocol Analyzer · {{ r.generated_at }} · Passive analysis: no keys were used; inferred values carry their confidence.</footer>
</div>
</body>
</html>
