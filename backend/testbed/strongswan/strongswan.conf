# Lab-only settings. Do NOT copy to production.
charon {
    load_modular = yes
    plugins {
        include strongswan.d/charon/*.conf
    }
    # Allows the IKEv1 Aggressive Mode + PSK scenario (strongSwan refuses it by default because
    # the PSK hash can be cracked offline — which is exactly what SecurIQ must detect).
    i_dont_care_about_security_and_use_aggressive_mode_psk = yes
    # Keep IKE fragmentation off so IKE_AUTH sizes stay a single message in the capture.
    fragment_size = 1400
    filelog {
        stdout {
            default = 1
            ike = 2
        }
    }
}
